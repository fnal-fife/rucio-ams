apiVersion: v1
kind: ConfigMap
metadata:
  name: alembic-script
data:
  generate_sql.sh: |
    #!/bin/bash
    python3 /usr/local/rucio/tools/merge_rucio_configs.py \
    -s /tmp/rucio.config.default.cfg $RUCIO_OVERRIDE_CONFIGS \
    --use-env \
    -d /opt/rucio/etc/rucio.cfg
    j2 /tmp/alembic.ini.j2 | sed '/^\s*$/d' > /opt/rucio/etc/alembic.ini
    #export ALEMBIC_CONFIG=/opt/rucio/etc/alembic.ini

    sed -i 's/\(script_location = \).*/\1\/usr\/local\/lib\/python3.9\/site-packages\/rucio\/db\/sqla\/migrate_repo/' $ALEMBIC_CONFIG
    alembic upgrade --sql $(alembic current | cut -d' ' -f1):head > /tmp/upgrade.sql
---
apiVersion: v1
kind: Pod
metadata:
  name: rucio-db-upgrade
spec:
  serviceAccountName: useroot
  volumes:
    - name: alembic-script-volume
      configMap:
        name: alembic-script
        defaultMode: 0755
  containers:
  - name: rucio-db-upgrade
    image: rucio/rucio-init:release-41.1.1
    command: ["sleep"]
    args: ["infinity"]
    resources:
      limits:
        cpu: 1000m
        memory: 1000Mi
      requests:
        cpu: 700m
        memory: 1000Mi
    volumeMounts:
      - name: alembic-script-volume
        mountPath: /tmp/generate_sql.sh
        subPath: generate_sql.sh
    env:
      - name: ALEMBIC_CONFIG
        value: /opt/rucio/etc/alembic.ini
      - name: RUCIO_CFG_DATABASE_DEFAULT
        valueFrom:
          secretKeyRef:
            name: fnal-db-connstr
            key: db-connstr.txt
